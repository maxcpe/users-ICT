# ระบบจัดการผู้ใช้ — วางใน server { } ของ service.ict.up.ac.th (spec 11.1)
# ต้องมี ^~ เพราะ root ของ server คือ C:/Web ไม่งั้น location อื่น (เช่น regex ไฟล์ static) จะแย่งไป
# Next.js ใช้ basePath /users จึงส่ง path เต็มต่อไป (proxy_pass ไม่มี / ท้าย)

location = /users {
    proxy_pass http://127.0.0.1:3006;
    include    users-proxy.inc;
}

location ^~ /users/ {
    proxy_pass http://127.0.0.1:3006;
    include    users-proxy.inc;
}
