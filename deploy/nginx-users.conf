# ระบบจัดการผู้ใช้ — วางใน server { listen 443 ssl; server_name service.ict.up.ac.th; } (spec 11.1)
# วางต่อจาก location ของ /evaluation/ ก่อน location /api_ict/
# ต้องมี ^~ เพราะ root ของ server คือ C:/Web ไม่งั้น location แบบ regex (\.php$, \.env ฯลฯ) จะแย่งไป
# Next.js ใช้ basePath /users จึงส่ง path เต็มต่อไป (proxy_pass ไม่มี / ท้าย)

	location = /users {
		proxy_pass http://127.0.0.1:3006;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;
	}

	location ^~ /users/ {
		proxy_pass http://127.0.0.1:3006;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Real-IP $remote_addr;

		proxy_read_timeout  60s;

		# cookie ของ Microsoft 365 ใหญ่ ถ้า buffer เล็กจะได้ 502 "upstream sent too big header"
		proxy_buffer_size 32k;
		proxy_buffers 8 32k;
		proxy_busy_buffers_size 64k;

		client_max_body_size 2m;
	}
