# deploy ระบบจัดการผู้ใช้ขึ้น SVR-ICT-SERVICE (spec 11.1)
# รันบน self-hosted runner ที่เครื่องจริง: ตรวจโค้ด → build → deploy\deploy.ps1
# ไม่มีความลับใน GitHub: .env อยู่ที่ C:\Web\users\.env บนเซิร์ฟเวอร์เท่านั้น
#
# ให้เร็ว: เก็บ node_modules และ .next/cache ไว้ระหว่างรอบ (runner เครื่องเดียว)
# และข้าม npm ci ถ้า package-lock.json ไม่เปลี่ยน
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_install:
        description: "ลบ node_modules แล้วติดตั้งใหม่ทั้งหมด (ใช้เมื่อ build เพี้ยน)"
        type: boolean
        default: false

# deploy ทีละครั้ง ไม่ยกเลิกตัวที่กำลังรัน
concurrency:
  group: deploy-users
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # repo นี้มี runner ตัวเดียวบน SVR-ICT-SERVICE (C:/actions-runner/users)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # clean: false = ไม่ลบไฟล์ที่ git ignore (node_modules, .next/cache, src/generated)
      - uses: actions/checkout@v4
        with:
          clean: false

      # ลบเฉพาะไฟล์ที่ไม่อยู่ใน git และไม่ได้ ignore (กันไฟล์ค้างจากรอบก่อน) แล้วคืนไฟล์ใน git ให้ตรง commit
      - name: Clean workspace
        run: |
          git reset --hard HEAD
          git clean -ffd
          if ("${{ inputs.clean_install }}" -eq "true" -and (Test-Path node_modules)) { cmd /c rmdir /s /q node_modules }

      - name: Install
        run: |
          $hash = (Get-FileHash package-lock.json -Algorithm SHA256).Hash
          $stamp = 'node_modules\.package-lock.sha256'
          if ((Test-Path $stamp) -and ((Get-Content $stamp -Raw).Trim() -eq $hash)) {
            Write-Host "package-lock.json unchanged - skip npm ci"
            npx prisma generate
          } else {
            npm ci --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Set-Content -Path $stamp -Value $hash -Encoding ascii
          }

      # typecheck อยู่ใน next build แล้ว
      - name: Lint + Test
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      # ค่าหลอกสำหรับตอน build เท่านั้น (build ไม่ต่อฐาน) ค่าจริงอ่านจาก C:\Web\users\.env ตอนรัน
      - name: Build
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://build:build@127.0.0.1:1/user
        run: npm run build

      - name: Deploy
        run: .\deploy\deploy.ps1 -Sha "${{ github.sha }}"
