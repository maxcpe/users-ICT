# deploy ระบบจัดการผู้ใช้ขึ้น SVR-ICT-SERVICE (spec 11.1)
# รันบน self-hosted runner ที่เครื่องจริง: ตรวจโค้ด → build → deploy\deploy.ps1
# ไม่มีความลับใน GitHub: .env อยู่ที่ C:\Web\users\.env บนเซิร์ฟเวอร์เท่านั้น
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy ทีละครั้ง ไม่ยกเลิกตัวที่กำลังรัน
concurrency:
  group: deploy-users
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, users]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Node version
        run: node -v; npm -v

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # ค่าหลอกสำหรับตอน build เท่านั้น (build ไม่ต่อฐาน) ค่าจริงอ่านจาก C:\Web\users\.env ตอนรัน
      - name: Build
        env:
          NODE_ENV: production
          DATABASE_URL: mysql://build:build@127.0.0.1:1/user
        run: npm run build

      - name: Deploy
        run: .\deploy\deploy.ps1 -Sha "${{ github.sha }}"
